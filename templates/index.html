<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAM AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1320;
    --card: #1a1f33;
    --card-glass: rgba(20,25,45,0.85);
    --border: #2a3150;
    --fg: #e3e6f0;
    --muted: #8891a8;
    --accent: #00d4ff;
    --gold: #ffd166;
    --danger: #ff6b6b;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden;
  }

  /* ===== 全屏背景 ===== */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background: url('/static/bg.jpg') center/cover no-repeat;
    filter: brightness(0.35) saturate(0.7);
  }
  .bg-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(135deg, rgba(10,14,28,0.6) 0%, rgba(15,19,32,0.8) 100%);
  }

  /* ===== 顶栏 ===== */
  header {
    position: relative; z-index: 10;
    padding: 14px 24px; border-bottom: 1px solid rgba(42,49,80,0.6);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(15,19,32,0.7); backdrop-filter: blur(12px);
  }
  header h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 0.5px; }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    background: #222a44; color: var(--accent); border: 1px solid var(--border);
  }

  /* ===== 主布局 ===== */
  .app-body {
    position: relative; z-index: 10;
    display: flex; height: calc(100vh - 53px);
  }

  /* 左侧边栏 */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: rgba(15,19,32,0.8); backdrop-filter: blur(10px);
    border-right: 1px solid rgba(42,49,80,0.6);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-search {
    padding: 16px; border-bottom: 1px solid rgba(42,49,80,0.5);
    flex-shrink: 0;
  }
  .sidebar-search label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;
  }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%; background: rgba(15,20,38,0.9); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); padding: 10px 34px 10px 12px;
    font-size: 14px; font-family: inherit;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; line-height: 1; padding: 0 4px; display: none;
  }
  .search-clear:hover { color: var(--fg); }
  .search-clear.visible { display: block; }
  .champ-count { font-size: 11px; color: var(--muted); margin-left: 6px; }

  /* 侧栏英雄列表 */
  .sidebar-list {
    flex: 1; overflow-y: auto; padding: 8px 12px 12px;
  }
  .sidebar-list::-webkit-scrollbar { width: 5px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .champ-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 6px;
  }
  .champ-cell {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: all .15s;
  }
  .champ-cell:hover { background: rgba(0,212,255,0.08); border-color: var(--accent); }
  .champ-cell img { width: 44px; height: 44px; border-radius: 6px; background: #000; object-fit: cover; }
  .champ-cell .n { font-size: 10px; color: #c9cde0; line-height: 1.1; text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .champ-cell.active { background: rgba(0,212,255,0.15); border-color: var(--accent); }

  /* 右侧内容区 */
  .content {
    flex: 1; overflow-y: auto; padding: 20px 24px;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 空状态 */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 70vh; text-align: center; color: var(--muted);
  }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state h2 { margin: 0 0 8px; font-size: 20px; color: var(--fg); opacity: 0.7; }
  .empty-state p { margin: 0; font-size: 14px; }

  /* ===== 结果卡片 ===== */
  .result-section {
    background: var(--card-glass); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  .result-section .placeholder { color: var(--muted); text-align: center; padding: 40px 0; }

  /* 两栏结果布局 */
  .result-layout { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
  @media (max-width: 1200px) { .result-layout { grid-template-columns: 1fr; } }

  /* rune build cards */
  .build-header { display:flex; align-items:center; gap:10px; margin:18px 0 12px; }
  .build-header:first-child { margin-top: 0; }
  .build-header h2 { margin:0; font-size:18px; color:var(--gold); }
  .build-header .sub { color:var(--muted); font-size:13px; }
  .build-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .build {
    background: linear-gradient(180deg,#1c223a 0%,#161b2e 100%);
    border:1px solid var(--border); border-radius:12px; padding:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .build.trap { border-color:#5a2030; background: linear-gradient(180deg,#2a1420 0%,#1a1018 100%); }
  .build .rating-row { display:flex; align-items:center; justify-content:space-between; }
  .rating-badge {
    font-weight:700; font-size:13px; padding:3px 10px; border-radius:999px;
    background:#2a3150; color:var(--gold);
  }
  .rating-SSS, .rating-SS { background:#3a2a10; color:#ffd166; }
  .rating-S { background:#1e3a2a; color:#7fd19c; }
  .rating-A { background:#1e2f3a; color:var(--accent); }
  .rating-B, .rating-C, .rating-D { background:#2a2030; color:#a39bb8; }
  .build.trap .rating-badge { background:#3a1020; color:#ff8a9a; }
  .tag { font-size:12px; color:var(--muted); }
  .hex-list { display:flex; flex-wrap:wrap; gap:8px; }
  .hex {
    display:flex; align-items:center; gap:6px;
    background:#0f1426; border:1px solid var(--border); color:#d8deed;
    padding:4px 10px 4px 4px; border-radius:8px; font-size:13px;
  }
  .hex img { width:28px; height:28px; border-radius:5px; background:#000; object-fit:cover; }
  .hex .name { white-space:nowrap; }
  .hex .tier-sm { font-size:10px; color:var(--muted); }
  .build.trap .hex { border-color:#5a2030; color:#ffb3c1; }
  .section-label { font-size:12px; color:var(--muted); margin-top:4px; }
  .items { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .item { display:flex; align-items:center; gap:5px; background:#0f1426; border:1px solid var(--border); padding:3px 8px 3px 3px; border-radius:6px; font-size:12px; color:#cfd4e3; position: relative; cursor: default; }
  .item img { width:24px; height:24px; border-radius:4px; background:#000; object-fit:cover; }
  /* 内嵌 tooltip 内容模板（不直接显示，由 JS 复制到浮动层） */
  .item-tooltip, .hex-tooltip, .aug-tooltip { display: none; }
  .item-tooltip .tt-name { color: #c89b3c; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .item-tooltip .tt-price { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .item-tooltip .tt-desc { color: #d0d4e8; }
  /* 全局浮动 tooltip 层 */
  #float-tooltip, #float-aug-tooltip {
    position: fixed; z-index: 999; display: none;
    min-width: 240px; max-width: 360px;
    background: rgba(12,16,32,0.96); backdrop-filter: blur(10px);
    border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.6;
    color: #c9cde0; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    white-space: pre-wrap; word-break: break-word;
  }
  #float-tooltip { border: 1px solid #c89b3c; box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 10px rgba(200,155,60,0.15); }
  #float-aug-tooltip { border: 1px solid var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 10px rgba(0,212,255,0.1); }
  #float-tooltip .tt-name, #float-aug-tooltip .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  #float-tooltip .tt-name { color: #c89b3c; }
  #float-aug-tooltip .tt-name { color: var(--gold); }
  #float-tooltip .tt-price { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  #float-tooltip .tt-desc, #float-aug-tooltip .tt-desc { color: #d0d4e8; }
  .arrow { color:var(--muted); font-size:14px; }
  .analysis { font-size:13px; line-height:1.55; color:#c9cde0; white-space:pre-wrap; }

  /* 海克斯强化 */
  .aug-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .aug-head h2 { margin:0; font-size:16px; color:var(--accent); }
  .aug-head .sub { font-size:11px; color:var(--muted); }
  .aug-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed #2a3150; }
  .aug-row:last-child { border-bottom:none; }
  .aug-row img { width:38px; height:38px; background:#000; border-radius:6px; flex-shrink:0; }
  .aug-row .aug-main { flex:1; min-width:0; }
  .aug-row .aug-name { font-size:13px; color:#e3e6f0; line-height:1.2; }
  .aug-row .aug-rarity { font-size:10px; padding:1px 6px; border-radius:3px; margin-left:6px; display:inline-block; vertical-align:middle; }
  .rarity-kSilver { background:#2a3150; color:#c9d4e3; }
  .rarity-kGold { background:#3a2a10; color:#ffd166; }
  .rarity-kPrismatic { background:#3a1a3e; color:#d8a8ff; }
  .aug-row .aug-stats { font-size:11px; color:var(--muted); margin-top:3px; }
  .aug-row .aug-stats .wr { color:#7fd19c; font-weight:600; }

  /* 海克斯天赋描述 tooltip */
  .aug-row { position: relative; }
  .hex { position: relative; cursor: default; }

  /* 通用 */
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--danger); }

  /* 按钮 */
  button.primary {
    padding: 8px 18px; background: var(--accent); color: #0b1020;
    border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .app-body { flex-direction: column; }
    .sidebar { width: 100%; min-width: auto; max-height: 45vh; border-right: none; border-bottom: 1px solid rgba(42,49,80,0.6); }
    .content { height: auto; }
  }
</style>
</head>
<body>

<!-- 全屏背景 -->
<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<header>
  <h1>ARAM 海克斯大乱斗助手</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="badge" id="provider-badge">&nbsp;</span>
    <span class="badge" id="user-badge" style="display:none"></span>
    <button id="btn-users" class="primary" style="display:none; margin:0; padding:5px 10px; font-size:11px; background:#2a3150; color:var(--accent)">用户管理</button>
    <button id="btn-invite" class="primary" style="display:none; margin:0; padding:5px 10px; font-size:11px; background:var(--gold); color:#1a1400">生成邀请链接</button>
    <button id="btn-chpass" class="primary" style="margin:0; padding:5px 10px; font-size:11px; background:#3a3f55; color:var(--fg)">修改密码</button>
    <button id="btn-logout" class="primary" style="margin:0; padding:5px 10px; font-size:11px; background:#3a3f55; color:var(--fg)">退出</button>
  </div>
</header>

<!-- 修改密码 / 用户管理 弹窗 -->
<div id="modal-mask" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:100; align-items:center; justify-content:center;">
  <div id="modal-box" style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:22px; min-width:420px; max-width:92vw; max-height:80vh; overflow:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 id="modal-title" style="margin:0; color:var(--gold); font-size:16px"></h3>
      <span id="modal-close" style="cursor:pointer; color:var(--muted); font-size:20px; line-height:1;">×</span>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="app-body">
  <!-- 左侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-search">
      <label>搜索英雄<span class="champ-count" id="champ-count"></span></label>
      <div class="search-wrap">
        <input type="text" id="runes-name" placeholder="中文名 / 英文名" autocomplete="off">
        <button class="search-clear" id="search-clear" title="清空">&times;</button>
      </div>
    </div>
    <div class="sidebar-list" id="champ-grid">
      <div class="placeholder" style="color:var(--muted); text-align:center; padding:40px 0"><span class="spinner"></span>加载英雄列表...</div>
    </div>
  </div>

  <!-- 右侧内容 -->
  <div class="content" id="content-area">
    <div class="empty-state" id="empty-state">
      <div class="icon">&#9876;</div>
      <h2>选择一位英雄</h2>
      <p>从左侧列表点击或搜索英雄名，查看海克斯联动方案与强化数据</p>
    </div>

    <div class="result-layout" id="result-area" style="display:none">
      <div class="result-section" id="result-apex">
        <div class="placeholder">海克斯联动方案</div>
      </div>
      <div class="result-section" id="result-aug" style="position:sticky; top:0;">
        <div class="placeholder">海克斯强化选取率</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- auth ----------
  fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !d.ok) { location.href = '/login'; return; }
    const u = d.user;
    const ub = document.getElementById('user-badge');
    ub.textContent = (u.is_admin ? '👑 ' : '👤 ') + u.username;
    ub.style.display = '';
    if (u.is_admin) {
      document.getElementById('btn-invite').style.display = '';
      document.getElementById('btn-users').style.display = '';
    }
  }).catch(() => {});

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login';
  });
  document.getElementById('btn-invite').addEventListener('click', async () => {
    const r = await fetch('/api/admin/invite', { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) { alert('生成失败：' + (d.detail || d.error || r.status)); return; }
    const baseUrl = await fetch('/api/config').then(r => r.json()).then(d => d.invite_base_url || '').catch(() => '');
    const link = baseUrl ? `${baseUrl.replace(/\/+$/, '')}/register?code=${d.code}` : `${location.origin}/register?code=${d.code}`;
    try { await navigator.clipboard.writeText(link); } catch (e) {}
    alert('邀请链接已生成并复制到剪贴板：\n\n' + link);
  });

  // ---------- 模态弹窗 ----------
  const mask = document.getElementById('modal-mask');
  const mTitle = document.getElementById('modal-title');
  const mBody = document.getElementById('modal-body');
  function openModal(title, html) {
    mTitle.textContent = title; mBody.innerHTML = html; mask.style.display = 'flex';
  }
  function closeModal() { mask.style.display = 'none'; mBody.innerHTML = ''; }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  mask.addEventListener('click', (e) => { if (e.target === mask) closeModal(); });

  const inputCss = 'width:100%; background:#0f1426; border:1px solid var(--border); border-radius:6px; color:var(--fg); padding:9px 11px; font-size:13px; font-family:inherit;';
  const labelCss = 'display:block; font-size:12px; color:var(--muted); margin:10px 0 5px;';

  // ---------- 修改密码 ----------
  document.getElementById('btn-chpass').addEventListener('click', () => {
    openModal('修改密码', `
      <label style="${labelCss}">原密码</label>
      <input type="password" id="cp-old" style="${inputCss}">
      <label style="${labelCss}">新密码（至少 6 位）</label>
      <input type="password" id="cp-new" style="${inputCss}">
      <label style="${labelCss}">再次输入新密码</label>
      <input type="password" id="cp-new2" style="${inputCss}">
      <div id="cp-msg" style="margin-top:10px; font-size:13px; min-height:18px; color:var(--danger)"></div>
      <button class="primary" id="cp-submit" style="margin-top:10px; width:100%">确认修改</button>
    `);
    document.getElementById('cp-submit').addEventListener('click', async (e) => {
      const btn = e.target; btn.disabled = true;
      const msg = document.getElementById('cp-msg'); msg.style.color = 'var(--danger)';
      const oldp = document.getElementById('cp-old').value;
      const newp = document.getElementById('cp-new').value;
      const newp2 = document.getElementById('cp-new2').value;
      if (!oldp || !newp) { msg.textContent = '请填写完整'; btn.disabled = false; return; }
      if (newp !== newp2) { msg.textContent = '两次新密码不一致'; btn.disabled = false; return; }
      try {
        const r = await fetch('/api/auth/change_password', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ old_password: oldp, new_password: newp }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { msg.textContent = d.detail || '修改失败'; return; }
        msg.style.color = '#7fd19c'; msg.textContent = '修改成功';
        setTimeout(closeModal, 800);
      } finally { btn.disabled = false; }
    });
  });

  // ---------- 用户管理 ----------
  function fmtTs(ts) {
    if (!ts) return '-';
    const d = new Date(ts * 1000);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  async function renderUserList() {
    const r = await fetch('/api/admin/users');
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { mBody.innerHTML = `<div style="color:var(--danger)">${d.detail || '加载失败'}</div>`; return; }
    const rows = d.users.map(u => `
      <tr>
        <td style="padding:8px 6px; border-bottom:1px solid var(--border)">${u.is_admin ? '👑' : '👤'} ${u.username}</td>
        <td style="padding:8px 6px; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px">${fmtTs(u.created_at)}</td>
        <td style="padding:8px 6px; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px">${fmtTs(u.last_login)}</td>
        <td style="padding:8px 6px; border-bottom:1px solid var(--border); text-align:right">
          <button class="primary btn-reset" data-id="${u.id}" data-name="${u.username}"
            style="margin:0; padding:4px 10px; font-size:12px; background:#3a3f55; color:var(--fg)">重置密码</button>
        </td>
      </tr>
    `).join('');
    mBody.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:13px">
        <thead><tr style="color:var(--muted); font-size:12px">
          <th style="text-align:left; padding:6px; border-bottom:1px solid var(--border)">用户</th>
          <th style="text-align:left; padding:6px; border-bottom:1px solid var(--border)">注册时间</th>
          <th style="text-align:left; padding:6px; border-bottom:1px solid var(--border)">最近登录</th>
          <th style="padding:6px; border-bottom:1px solid var(--border)"></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="padding:16px; color:var(--muted); text-align:center">暂无用户</td></tr>'}</tbody>
      </table>
    `;
    mBody.querySelectorAll('.btn-reset').forEach(btn => {
      btn.addEventListener('click', () => adminResetPassword(btn.dataset.id, btn.dataset.name));
    });
  }
  async function adminResetPassword(userId, username) {
    const pwd = prompt(`为用户「${username}」设置新密码（至少 6 位）：`);
    if (pwd === null) return;
    if (!pwd || pwd.length < 6) { alert('密码至少 6 位'); return; }
    const r = await fetch(`/api/admin/users/${userId}/reset_password`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ new_password: pwd }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { alert('重置失败：' + (d.detail || r.status)); return; }
    alert(`已为「${username}」重置密码：\n${pwd}`);
  }
  document.getElementById('btn-users').addEventListener('click', () => {
    openModal('用户管理', '<div style="color:var(--muted)">加载中...</div>');
    renderUserList();
  });

  fetch('/api/config').then(r => r.json()).then(d => {
    document.getElementById('provider-badge').textContent =
      'Provider: ' + (d.llm_provider || 'gemini');
  }).catch(() => {});

  // ---------- 核心逻辑 ----------
  const apexEl = document.getElementById('result-apex');
  const augEl = document.getElementById('result-aug');
  const emptyState = document.getElementById('empty-state');
  const resultArea = document.getElementById('result-area');

  function showResults() {
    emptyState.style.display = 'none';
    resultArea.style.display = '';
  }
  function setApexLoading(label) {
    apexEl.innerHTML = '<div class="placeholder"><span class="spinner"></span>' + label + '...</div>';
  }
  function setAugLoading(label) {
    augEl.innerHTML = '<div class="placeholder"><span class="spinner"></span>' + label + '...</div>';
  }
  function showError(el, msg) {
    el.innerHTML = '<div class="error">❌ ' + msg + '</div>';
  }
  async function postJson(url, body) {
    const r = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    return r.json();
  }

  // 联动方案渲染
  function renderBuilds(data) {
    const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    // 构建描述查找索引：ID 优先，中文名回退
    const hextechDescs = data.hextech_descriptions || {};
    const descByName = {};
    const descByIcon = {};
    for (const [id, info] of Object.entries(hextechDescs)) {
      if (info.name) descByName[info.name] = info.description || '';
      if (info.icon_url) descByIcon[info.icon_url] = info.description || '';
    }
    // 装备描述查找索引：按中文名
    const itemDescs = data.item_descriptions || {};
    const renderCard = (b, idx, isTrap) => {
      const rating = esc(b.rating || '');
      const ratingCls = 'rating-badge rating-' + (rating.match(/S+|[ABCD]/)?.[0] || '');
      const hexs = (b.hextechs || []).map((h, i) => {
        const icon = (b.hex_icons || [])[i];
        const tier = (b.tiers || [])[i] || '';
        const imgHtml = icon ? `<img src="${esc(icon)}" alt="${esc(h)}" loading="lazy" onerror="this.style.display='none'">` : '';
        const tierHtml = tier ? `<span class="tier-sm">${esc(tier)}</span>` : '';
        // 查找描述：优先图标 URL 精确匹配，回退中文名匹配
        let desc = icon ? (descByIcon[icon] || '') : '';
        if (!desc && h) desc = descByName[h] || '';
        const tooltipHtml = desc
          ? `<div class="hex-tooltip"><div class="tt-name">${esc(h)}</div><div class="tt-desc">${esc(desc)}</div></div>`
          : '';
        return `<span class="hex">${imgHtml}<span class="name">${esc(h)}</span>${tierHtml}${tooltipHtml}</span>`;
      }).join('');
      const items = (b.items || []).length
        ? (b.items || []).map((it, i) => {
            const icon = (b.item_icons || [])[i];
            const imgHtml = icon ? `<img src="${esc(icon)}" alt="${esc(it)}" loading="lazy" onerror="this.style.display='none'">` : '';
            // 查找装备描述
            const itemInfo = itemDescs[it];
            const itemDesc = itemInfo ? itemInfo.description : '';
            const itemPrice = itemInfo ? itemInfo.price : '';
            const priceHtml = itemPrice ? `<div class="tt-price">💰 ${itemPrice} 金币</div>` : '';
            const tooltipHtml = itemDesc
              ? `<div class="item-tooltip"><div class="tt-name">${esc(it)}</div>${priceHtml}<div class="tt-desc">${esc(itemDesc)}</div></div>`
              : '';
            return (i > 0 ? '<span class="arrow">→</span>' : '') + `<span class="item">${imgHtml}<span>${esc(it)}</span>${tooltipHtml}</span>`;
          }).join('')
        : '<span class="section-label">（无推荐出装数据）</span>';
      const label = isTrap ? '⚠️ 陷阱' : (b.tag || '');
      return `
        <div class="build ${isTrap ? 'trap' : ''}">
          <div class="rating-row">
            <span class="${ratingCls}">${rating || '未知'} 级</span>
            <span class="tag">${esc(label)}</span>
          </div>
          <div>
            <div class="section-label">海克斯组合（${(b.hextechs || []).length} 个）</div>
            <div class="hex-list">${hexs || '<span class="tag">无</span>'}</div>
          </div>
          ${b.analysis ? `<div>
            <div class="section-label">机制解析</div>
            <div class="analysis">${esc(b.analysis)}</div>
          </div>` : ''}
          <div>
            <div class="section-label">推荐出装</div>
            <div class="items">${items}</div>
          </div>
        </div>
      `;
    };
    const header = `
      <div class="build-header">
        <h2>${esc(data.champion_cn || '')}</h2>
        <span class="sub">共 ${data.builds.length} 套方案${data.trap_warnings?.length ? ` · ${data.trap_warnings.length} 个陷阱警告` : ''}</span>
      </div>
    `;
    const buildsHtml = data.builds.length
      ? `<div class="build-grid">${data.builds.map((b,i) => renderCard(b, i, false)).join('')}</div>`
      : '<div class="placeholder">暂无正常方案数据</div>';
    const trapsHtml = data.trap_warnings?.length
      ? `<div class="build-header"><h2 style="color:#ff8a9a">❌ 陷阱警告</h2><span class="sub">这些组合胜率偏低，建议避开</span></div>
         <div class="build-grid">${data.trap_warnings.map((b,i) => renderCard(b, i, true)).join('')}</div>`
      : '';
    apexEl.innerHTML = header + buildsHtml + trapsHtml;
  }

  // 海克斯强化侧栏
  function renderAugments(d) {
    const esc = s => (s == null ? '' : String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])));
    const img = (url, alt='') => url ? `<img src="${esc(url)}" alt="${esc(alt)}" title="${esc(alt)}" loading="lazy" onerror="this.style.display='none'">` : '';
    const rarityLabel = r => ({kPrismatic:'棱彩', kGold:'金', kSilver:'银'})[r] || r.replace('k','');
    const hextechDescs = d.hextech_descriptions || {};
    const augs = (d.augments || []).map(a => {
      // 通过 augment ID 查找描述
      const descInfo = hextechDescs[String(a.id)];
      const desc = descInfo ? descInfo.description : '';
      const tooltipHtml = desc
        ? `<div class="aug-tooltip"><div class="tt-name">${esc(a.name)}</div><div class="tt-desc">${esc(desc)}</div></div>`
        : '';
      return `
      <div class="aug-row" data-aug-id="${a.id}">
        ${img(a.icon_url, a.name)}
        <div class="aug-main">
          <div class="aug-name">${esc(a.name)}<span class="aug-rarity rarity-${esc(a.rarity)}">${esc(rarityLabel(a.rarity))}</span></div>
          <div class="aug-stats">选取 ${a.pick_rate}% · <span class="wr">胜 ${a.win_rate != null ? a.win_rate+'%' : '—'}</span>${a.avg_place != null ? ` · 平均名次 ${a.avg_place}` : ''}</div>
        </div>
        ${tooltipHtml}
      </div>`;
    }).join('');
    const cachedTag = d.cached ? '<span class="sub" style="color:#7fd19c">· 缓存命中</span>' : '';
    return `
      <div class="aug-head">
        <h2>🎁 海克斯强化</h2>
        <span class="sub">补丁 ${esc(d.version || '?')} ${cachedTag}</span>
      </div>
      <div class="sub" style="margin-bottom:8px; color:var(--muted); font-size:11px;">按选取率排序 · 悬停查看详情</div>
      ${augs || '<div class="placeholder">暂无数据</div>'}
    `;
  }

  async function fetchAll() {
    const name = document.getElementById('runes-name').value.trim();
    if (!name) return alert('请填写英雄名');
    showResults();
    setApexLoading('查询 ' + name + ' 联动方案');
    setAugLoading('查询 ' + name + ' 海克斯强化');
    postJson('/api/rune_data', {champion: name, num_builds: 12}).then(d => {
      if (d.ok) {
        renderBuilds(d);
        // 装备/hex tooltip 定位（使用全局浮动层，不受 overflow/transform 裁剪）
        let _ttEl = null;
        apexEl.querySelectorAll('.item, .hex').forEach(el => {
          el.addEventListener('mouseenter', () => {
            const src = el.querySelector('.item-tooltip, .hex-tooltip');
            if (!src) return;
            if (!_ttEl) {
              _ttEl = document.createElement('div');
              _ttEl.id = 'float-tooltip';
              document.body.appendChild(_ttEl);
            }
            _ttEl.innerHTML = src.innerHTML;
            _ttEl.className = src.className;
            _ttEl.style.display = 'block';
            const parentRect = el.getBoundingClientRect();
            // 先显示以获取尺寸
            const ttRect = _ttEl.getBoundingClientRect();
            let left = parentRect.left + parentRect.width / 2 - ttRect.width / 2;
            let top = parentRect.bottom + 4;
            if (left < 4) left = 4;
            if (left + ttRect.width > window.innerWidth - 4) left = window.innerWidth - ttRect.width - 4;
            if (top + ttRect.height > window.innerHeight - 4) top = parentRect.top - ttRect.height - 4;
            _ttEl.style.left = left + 'px';
            _ttEl.style.top = top + 'px';
          });
          el.addEventListener('mouseleave', () => {
            if (_ttEl) _ttEl.style.display = 'none';
          });
        });
      } else {
        showError(apexEl, d.error || '方案请求失败');
      }
    }).catch(e => showError(apexEl, e.message));
    postJson('/api/augments', {champion: name}).then(d => {
      if (d.ok) {
        augEl.innerHTML = renderAugments(d);
        // 天赋 tooltip 定位（使用全局浮动层，不受 overflow/transform 裁剪）
        let _augTtEl = null;
        augEl.querySelectorAll('.aug-row').forEach(row => {
          row.addEventListener('mouseenter', () => {
            const src = row.querySelector('.aug-tooltip');
            if (!src) return;
            if (!_augTtEl) {
              _augTtEl = document.createElement('div');
              _augTtEl.id = 'float-aug-tooltip';
              document.body.appendChild(_augTtEl);
            }
            _augTtEl.innerHTML = src.innerHTML;
            _augTtEl.className = src.className;
            _augTtEl.style.display = 'block';
            const parentRect = row.getBoundingClientRect();
            const ttRect = _augTtEl.getBoundingClientRect();
            let left = parentRect.left + parentRect.width / 2 - ttRect.width / 2;
            let top = parentRect.bottom + 4;
            if (left < 4) left = 4;
            if (left + ttRect.width > window.innerWidth - 4) left = window.innerWidth - ttRect.width - 4;
            if (top + ttRect.height > window.innerHeight - 4) top = parentRect.top - ttRect.height - 4;
            _augTtEl.style.left = left + 'px';
            _augTtEl.style.top = top + 'px';
          });
          row.addEventListener('mouseleave', () => {
            if (_augTtEl) _augTtEl.style.display = 'none';
          });
        });
      } else {
        showError(augEl, d.error || '海克斯强化请求失败');
      }
    }).catch(e => showError(augEl, e.message));
  }

  document.getElementById('runes-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchAll();
  });

  // ---------- 英雄列表 ----------
  let allChamps = [];
  const gridEl = document.getElementById('champ-grid');
  const countEl = document.getElementById('champ-count');
  const inputEl = document.getElementById('runes-name');
  const clearBtn = document.getElementById('search-clear');

  function updateClearBtn() {
    clearBtn.classList.toggle('visible', !!inputEl.value.trim());
  }

  clearBtn.addEventListener('click', () => {
    inputEl.value = '';
    inputEl.focus();
    renderGrid(allChamps);
    updateClearBtn();
  });

  function renderGrid(list, highlight) {
    const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    if (!list.length) {
      gridEl.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px 0; font-size:12px;">无匹配英雄</div>';
      return;
    }
    gridEl.innerHTML = '<div class="champ-grid">' + list.map(c => `
      <div class="champ-cell ${highlight === c.id ? 'active' : ''}" data-id="${esc(c.id)}" data-cn="${esc(c.name_cn)}" title="${esc(c.name_cn)} · ${esc(c.title_cn)}">
        <img src="${esc(c.icon)}" alt="${esc(c.name_cn)}" loading="lazy" onerror="this.style.opacity=0.3">
        <div class="n">${esc(c.name_cn)}</div>
      </div>`).join('') + '</div>';
  }

  function filterChamps(q) {
    q = (q || '').trim().toLowerCase();
    if (!q) return allChamps;
    return allChamps.filter(c =>
      c.name_cn.includes(q) ||
      c.name_en.toLowerCase().includes(q) ||
      c.id.toLowerCase().includes(q) ||
      (c.title_cn || '').includes(q)
    );
  }

  inputEl.addEventListener('input', () => {
    renderGrid(filterChamps(inputEl.value));
    updateClearBtn();
  });

  gridEl.addEventListener('click', e => {
    const cell = e.target.closest('.champ-cell');
    if (!cell) return;
    const name = cell.dataset.cn;
    inputEl.value = name;
    renderGrid(filterChamps(name), cell.dataset.id);
    updateClearBtn();
    fetchAll();
  });

  fetch('/api/champions').then(async r => {
    const text = await r.text();
    let d = {};
    try { d = JSON.parse(text); } catch { d = {}; }
    if (!r.ok) throw new Error(`HTTP ${r.status} ${d.detail || d.error || text.slice(0,80)}`);
    if (!d.ok) throw new Error(d.error || '响应缺少 ok 字段');
    allChamps = d.champions || [];
    countEl.textContent = `共 ${allChamps.length} 位`;
    renderGrid(allChamps);
    updateClearBtn();
  }).catch(e => {
    gridEl.innerHTML = `<div style="color:var(--danger); text-align:center; padding:20px; font-size:12px;">英雄列表加载失败：${e.message}</div>`;
  });
</script>
</body>
</html>
